      <stop stop-color="#2B78FF" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#2B78FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(450 450) rotate(90) scale(260)">
      <stop stop-color="#8AD7FF" stop-opacity="0.92"/>
      <stop offset="0.38" stop-color="#2F84FF" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#07132C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="needleBlue" x1="450" y1="160" x2="450" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8CE5FF"/>
      <stop offset="1" stop-color="#2A73FF"/>
